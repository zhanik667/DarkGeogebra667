name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q GeoGebraDark.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash scripts/fetch_geogebra.sh
        working-directory: GeoGebraDark
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: GeoGebraDark
      - uses: actions/upload-artifact@v4
        with:
          name: GeoGebraDark-debug-apk
          path: GeoGebraDark/app/build/outputs/apk/debug/*.apk
